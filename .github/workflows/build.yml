name: Build DEB Package

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Theos
      uses: hennes/theos-action@main

    - name: Build Package
      run: make package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Deb-Package
        path: packages/*.deb
