name: Build Dylib

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
      - name: Download SDK
        run: |
          mkdir -p $HOME/theos/sdks
          git clone --depth=1 https://github.com/leminkong/iPhoneOSX.sdk.git $HOME/theos/sdks/iPhoneOS14.5.sdk
      - name: Compile
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker
          path: .theos/obj/debug/AutoClicker.dylib
